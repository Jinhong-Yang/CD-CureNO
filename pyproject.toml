[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "cdcureno"
version = "0.0.3"
description = "Cross-dimensional causal neural operators for composite curing"
readme = "README.md"
license = {file = "LICENSE.txt"}
requires-python = ">=3.10,<3.13"
dependencies = [
  "matplotlib==3.10.9",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pyarrow==25.0.0",
  "PyYAML==6.0.2",
  "scipy==1.15.3",
  "torch==2.13.0",
]

[project.optional-dependencies]
revision = ["psutil==7.2.2"]
dev = [
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
