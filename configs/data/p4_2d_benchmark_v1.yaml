families:
  F0: exact_extrusion_anchor
  F1_smooth: spatially_varying_smooth_top_htc
  F1_piecewise: spatially_varying_piecewise_top_htc
  F2_left: one_sided_edge_convection
  F2_both: asymmetric_two_sided_edge_convection
  F1_F2_combined: combined_pattern_and_edge_ood_only
sampling:
  design: scrambled_sobol
  # Every named coordinate has one exclusive Sobol dimension. In particular,
  # cycle parameters are not reused for spatial-family or HTC selection.
  dimensions:
    - cycle_family_selector
    - cycle_p0
    - cycle_p1
    - cycle_p2
    - cycle_p3
    - cycle_p4
    - cycle_p5
    - cycle_p6
    - cycle_p7
    - cycle_p8
    - difficulty_selector
    - difficulty_variant
    - bottom_htc
    - top_htc_center
    - top_htc_amplitude
    - top_htc_frequency
    - top_htc_phase
    - edge_htc
    - edge_asymmetry
    - conductivity_scale
    - reaction_enthalpy_scale
  category_thresholds:
    id_single_hold_fraction: 0.35
    ood_smart_cure_fraction: 0.50
    f0_fraction: 0.10
    f1_upper_fraction: 0.55
  ranges:
    id:
      bottom_h_W_m2_K: [45.0, 95.0]
      top_h_center_W_m2_K: [90.0, 145.0]
      top_h_amplitude_W_m2_K: [8.0, 25.0]
      edge_h_W_m2_K: [10.0, 55.0]
      top_h_frequencies_per_width: [1, 2]
    ood:
      bottom_h_W_m2_K: [95.0, 115.0]
      top_h_center_W_m2_K: [155.0, 175.0]
      top_h_amplitude_W_m2_K: [25.0, 40.0]
      edge_h_W_m2_K: [75.0, 100.0]
      top_h_frequencies_per_width: [3, 4]
    common:
      # Applied to both axes while preserving the sourced anisotropy ratio.
      composite_conductivity_scale: [0.85, 1.15]
      reaction_enthalpy_scale: [0.90, 1.10]
  parameter_rationale: references/parameter_range_rationale.md
solver:
  coupling_tolerance_K: 1.0e-9
  maximum_coupling_iterations: 16
storage:
  format: directory_of_npy_arrays_plus_jsonl_metadata
  canonical_order: "[case,time,z,x]"
  root: data/processed/p4_2d_{tier}_v1
  dtype: float32
  minimum_free_disk_bytes: 536870912
  minimum_free_memory_bytes: 1073741824
  maximum_in_flight_per_worker: 2
acceptance:
  maximum_abs_energy_residual_W_m3_max: 1.0e-4
  maximum_relative_global_energy_residual_max: 1.0e-8
  maximum_interface_flux_imbalance_W_max: 1.0e-9
  maximum_temperature_interface_jump_K_max: 1.0e-10
  maximum_robin_flux_imbalance_W_max: 1.0e-9
  maximum_converged_coupling_update_K_max: 1.0e-9
  alpha_bound_violation_count_max: 0
  alpha_monotonicity_violation_count_max: 0
  tool_alpha_nonzero_count_max: 0
  finite_field_required: true
  all_coupling_steps_converged_required: true
  silent_failure_count_max: 0
